[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "Multimodal agentic research and decision copilot"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "fastapi",
    "langgraph",
    "pdfplumber",
    "pymupdf",
    "python-multipart",
    "rank-bm25",
    "reportlab",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
